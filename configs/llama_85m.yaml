# Architecture 4: Llama-style decoder (RMSNorm + RoPE + GQA + SwiGLU), ~84.7M params.
run_name: llama_85m_v1
arch: llama
out_dir: runs

model:                       # passed into models/modern.py::ModernConfig
  d_model: 768
  n_layers: 12
  n_heads: 12
  n_kv_heads: 4              # GQA (1 = MQA, 12 = MHA)
  d_ff: 2048                 # SwiGLU hidden (3 matrices -> ~same params as a 3072 GELU FFN)
  max_seq_len: 1024
  dropout: 0.0
  rope_theta: 10000.0

data:
  dir: /kaggle/input/cs781-prep/data_v1      # <-- change to where your prep output is attached
  block_size: 1024
  weights:                   # sampling mix (proportional to file size); change freely
    acts: 0.04
    supreme_court: 0.07
    high_courts: 0.55
    tribunals: 0.34

train:
  seed: 1337
  init_std: 0.02            # GPT-2 init (see models/__init__.py::init_weights)
  batch_size: 8              # sequences per micro-batch (lower it if CUDA OOM)
  grad_accum: 8              # 8 x 8 x 1024 = 65,536 tokens per optimizer step
  max_steps: 6000            # set from your measured tok/s and available hours
  lr: 6.0e-4
  min_lr: 6.0e-5
  warmup_steps: 300
  weight_decay: 0.1
  betas: [0.9, 0.95]
  grad_clip: 1.0
  amp: true                  # fp16 mixed precision on T4
  log_every: 20
  eval_every: 500
  eval_batches: 40
  time_limit_hours: 11.0     # stop + save before Kaggle's 12h limit