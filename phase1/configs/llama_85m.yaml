# Llama-style Transformer (RMSNorm, RoPE, grouped-query attention, SwiGLU), about 85M weights.
run_name: llama_85m_v1
arch: llama
out_dir: runs

model:
  d_model: 768
  n_layers: 12
  n_heads: 12
  n_kv_heads: 4
  d_ff: 2048
  max_seq_len: 1024
  dropout: 0.0
  rope_theta: 10000.0

data:
  dir: /kaggle/input/cs781-prep/data_v1
  block_size: 1024
  weights:
    acts: 0.04
    supreme_court: 0.07
    high_courts: 0.55
    tribunals: 0.34

train:
  seed: 1337
  init_std: 0.02
  batch_size: 8
  grad_accum: 8
  max_steps: 6000
  lr: 6.0e-4
  min_lr: 6.0e-5
  warmup_steps: 300
  weight_decay: 0.1
  betas: [0.9, 0.95]
  grad_clip: 1.0
  amp: true
  log_every: 20
  eval_every: 500
  eval_batches: 40
  time_limit_hours: 11.0
