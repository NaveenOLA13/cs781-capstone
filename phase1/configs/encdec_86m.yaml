# Recurrent encoder-decoder with attention, about 86M weights.
run_name: encdec_86m_v1
arch: encdec
out_dir: runs

model:
  emb_dim: 512
  hidden_size: 1024
  enc_layers: 2
  dec_layers: 2
  attention: dot
  attn_dim: 256
  dropout: 0.0
  src_len: 512
  max_seq_len: 1024

data:
  dir: /kaggle/input/cs781-prep/data_v1
  block_size: 1024
  weights:
    acts: 0.04
    supreme_court: 0.07
    high_courts: 0.55
    tribunals: 0.34

train:
  seed: 1337
  init_std: 0.02
  batch_size: 16
  grad_accum: 4
  max_steps: 4500
  lr: 1.0e-3
  min_lr: 1.0e-4
  warmup_steps: 300
  weight_decay: 0.1
  betas: [0.9, 0.95]
  grad_clip: 1.0
  amp: true
  log_every: 20
  eval_every: 500
  eval_batches: 40
  time_limit_hours: 11.0
